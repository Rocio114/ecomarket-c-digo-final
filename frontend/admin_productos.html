<!DOCTYPE html>
<html lang="es">
<head>
    <title>Admin - Gestión de Productos (#26/#27)</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root { 
            --color-primary: #4CAF50; 
            --color-secondary: #FF9800; 
        }
        body { background-color: #f7f7f7; }
        .navbar { background-color: var(--color-primary); }
        .product-card { transition: transform 0.2s; border: 1px solid #ddd; }
        .btn-ecomarket-secondary {
            background-color: var(--color-secondary);
            border-color: var(--color-secondary);
            color: white;
            transition: background-color 0.2s;
        }
        .btn-ecomarket-secondary:hover {
            background-color: #E68900;
            border-color: #E68900;
            color: white;
        }
        .product-info {
            font-size: 0.9rem;
        }
    </style>
</head>
<body id="admin-products-page">

<nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
        <a class="navbar-brand text-white fw-bold" href="#">
            <span style="color: var(--color-secondary);">Eco</span>Market 🥦🍎
        </a>
    </div>
</nav>

<div class="container mt-4">
    
    <div class="row align-items-center mb-4 border-bottom pb-2">
        <div class="col-6">
            <h2 class="fw-bold mb-0 text-start">Productos</h2>
        </div>
        <div class="col-6 text-end">
            <button class="btn btn-ecomarket-secondary" onclick="goBackToDashboard()">
                <i class="bi bi-arrow-left me-2"></i> Regresar
            </button>
        </div>
    </div>

    <div id="product-list-container" class="row">
        </div>
    
    <div class="row my-5 align-items-center">
        <div class="col-6 d-flex justify-content-start">
            <nav><ul id="pagination-menu" class="pagination">
                <li class="page-item active"><a class="page-link" href="#">1</a></li>
                <li class="page-item"><a class="page-link" href="#">2</a></li>
                <li class="page-item"><a class="page-link" href="#">3</a></li>
            </ul></nav>
        </div>
        
        <div class="col-6 text-end">
            <button class="btn btn-lg btn-ecomarket-secondary" onclick="goToCreateProduct()">
                <i class="bi bi-plus-circle-fill me-2"></i> Crear
            </button>
        </div>
    </div>
</div>

<script src="app.js"></script>

</body>
</html>
